<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis | Yanmvisuals</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Inter, sans-serif;
            background: #f5f4f0;
            color: #1c1b1a;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 760px;
        }
        .title {
            font-size: clamp(2rem, 4vw, 3rem);
            margin-bottom: 1rem;
            font-weight: 800;
        }
        .subtitle {
            font-size: 1rem;
            color: #555;
            line-height: 1.8;
        }
        .home-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.9rem 1.8rem;
            border-radius: 999px;
            background: #1c1b1a;
            color: #fff;
            text-decoration: none;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .home-link:hover {
            transform: translateY(-2px);
            background: #3c3a39;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Avis clients</h1>
        <p class="subtitle">Cette page sera bientôt enrichie avec les retours de mes clients. Pour l'instant, elle reste volontairement simple et ouverte à la suite.</p>
        <a class="home-link" href="/index.html">Retour au site</a>

</html>
